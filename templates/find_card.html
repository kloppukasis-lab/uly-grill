{% extends "base.html" %}{% block title %}Найти карту · ULY GRILL{% endblock %}{% block wrapclass %}narrow{% endblock %}{% block content %}<section class="panel"><h1 style="font-size:32px">Найти карту</h1><form method="post"><label for="phone">Номер телефона, указанный при регистрации</label><input id="phone" name="phone" value="{{ phone }}" inputmode="tel" required><button class="full" type="submit">Найти карту</button></form>{% if customer %}<hr class="divider"><p>Карта найдена: <strong>{{ customer['name'] }}</strong></p><a class="btn" href="{{ url_for('customer_card', card_code=customer['card_code']) }}">Открыть карту · {{ customer['visits'] }}/10</a>{% endif %}<p><a class="btn alt" href="{{ url_for('index') }}">Назад</a></p></section>{% endblock %}
